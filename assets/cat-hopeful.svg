<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">Cute hopeful cat</title>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8fb"/>
      <stop offset="100%" stop-color="#ffd6e5"/>
    </linearGradient>
  </defs>
  <g class="sparkles">
    <circle cx="34" cy="42" r="3" fill="#ff8fab">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="48" r="2.5" fill="#e85a7a">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="156" r="3" fill="#ff8fab">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(100 108)">
    <!-- ears -->
    <path d="M-42 -38 L-58 -78 L-18 -52 Z" fill="url(#fur)" stroke="#ff8fab" stroke-width="3" stroke-linejoin="round"/>
    <path d="M42 -38 L58 -78 L18 -52 Z" fill="url(#fur)" stroke="#ff8fab" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-42 -42 L-52 -68 L-28 -50 Z" fill="#ff9eb5"/>
    <path d="M42 -42 L52 -68 L28 -50 Z" fill="#ff9eb5"/>
    <!-- head -->
    <ellipse cx="0" cy="-8" rx="52" ry="46" fill="url(#fur)" stroke="#ff8fab" stroke-width="3"/>
    <!-- blush -->
    <ellipse cx="-28" cy="4" rx="10" ry="6" fill="#ff8fab" opacity="0.45"/>
    <ellipse cx="28" cy="4" rx="10" ry="6" fill="#ff8fab" opacity="0.45"/>
    <!-- eyes -->
    <g>
      <ellipse cx="-18" cy="-12" rx="7" ry="9" fill="#5a3342">
        <animate attributeName="ry" values="9;1;9" keyTimes="0;0.1;0.2" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="18" cy="-12" rx="7" ry="9" fill="#5a3342">
        <animate attributeName="ry" values="9;1;9" keyTimes="0;0.1;0.2" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="-16" cy="-15" r="2.2" fill="#fff"/>
      <circle cx="20" cy="-15" r="2.2" fill="#fff"/>
    </g>
    <!-- nose + mouth -->
    <path d="M0 0 L-4 5 L4 5 Z" fill="#e85a7a"/>
    <path d="M0 5 Q-10 14 -16 8" fill="none" stroke="#5a3342" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 5 Q10 14 16 8" fill="none" stroke="#5a3342" stroke-width="2.5" stroke-linecap="round"/>
    <!-- whiskers -->
    <path d="M-22 6 L-48 0 M-22 10 L-48 12 M22 6 L48 0 M22 10 L48 12" stroke="#c97a90" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- body hint -->
    <ellipse cx="0" cy="52" rx="38" ry="22" fill="url(#fur)" stroke="#ff8fab" stroke-width="3"/>
  </g>
  <!-- floating heart -->
  <g transform="translate(148 70)">
    <path d="M0 6 C0 0 8 -4 12 2 C16 -4 24 0 24 6 C24 14 12 22 12 22 C12 22 0 14 0 6 Z" fill="#ff6b8a" transform="scale(0.7)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
